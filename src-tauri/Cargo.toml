[package]
name = "treefold"
version = "0.1.0"
description = "Local-first macOS workspace for parallel coding agents"
authors = ["Treefold contributors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "treefold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
amux = { package = "amux-runtime", path = "/Users/admin/code/codebase/self/rs-agent/amux" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
moka = { version = "0.12", features = ["future"] }
async-sqlite = { version = "0.6", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml_edit = { version = "0.25", features = ["serde"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time"] }
tokio-tungstenite = "0.27"
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
