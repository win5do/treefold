appId: com.win5do.treefold
productName: Treefold
artifactName: '${productName}-${version}-${arch}.${ext}'
asar: true
directories:
  output: release
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: src/backend/bundle-staging/bin
    to: bin
  - from: src/backend/bundle-staging/agent-integration
    to: agent-integration
  - from: build/icons/32x32.png
    to: icon.png
mac:
  minimumSystemVersion: '14.0'
  category: public.app-category.developer-tools
  icon: build/icons/icon.icns
  identity: '-'
  preAutoEntitlements: false
  timestamp: none
  strictVerify: true
  notarize: false
  target:
    - dmg
    - zip
    - dir
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/bin/treefold-backend
    - Contents/Resources/bin/treefold
    - Contents/Resources/bin/amux
