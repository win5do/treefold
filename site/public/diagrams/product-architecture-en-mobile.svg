<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1230" viewBox="0 0 440 1230" role="img" aria-labelledby="title description"><title id="title">Treefold product architecture</title><desc id="description">Organize repositories and reference directories. Own a feature. Split Todos into parallel subtasks. Own branch and worktree. Sessions within the same Workspace / Fork share a checkout. Review, then merge into the parent Workspace. Code, Todos, and delivery records belong to the work and survive Session changes.. Local-first · Remote review and CI stay on your Git host · Archive keeps worktrees; deletion handles cleanup</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a5a6ff"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0.5" y="0.5" width="439" height="1229" rx="14" fill="#0d0e12" stroke="#343747"/>
<text x="28" y="44" font-size="24" fill="#f4f4f5" font-weight="650">Treefold product architecture</text>
<text x="28" y="74" font-size="13" fill="#acafbf" font-weight="400">Run agents in parallel. Fold the work back cleanly.</text>
<rect x="24" y="98" width="392" height="112" rx="14" fill="#15171e" stroke="#343747"/>
<text x="44" y="128" font-size="19" fill="#b9baff" font-weight="650">Project</text>
<text x="44" y="158" font-size="13" fill="#f4f4f5" font-weight="400">Organize repositories and reference directories</text>
<text x="44" y="188" font-size="12" fill="#acafbf" font-weight="400">Frontend repo · Backend repo · Read-only Context</text>
<path d="M220 210 L220 230" fill="none" stroke="#a5a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="236" width="392" height="720" rx="14" fill="#141420" stroke="#6263a0"/>
<text x="44" y="268" font-size="20" fill="#c0c1ff" font-weight="650">Workspace</text>
<text x="44" y="294" font-size="15" fill="#f4f4f5" font-weight="400">Own a feature</text>
<text x="44" y="320" font-size="13" fill="#acafbf" font-weight="400">Dedicated branch and worktree per repository</text>
<text x="44" y="349" font-size="13" fill="#acafbf" font-weight="400">Agent / Shell Sessions · Execute and resume</text>
<text x="44" y="387" font-size="14" fill="#c0c1ff" font-weight="400">Split Todos into parallel subtasks</text>
<rect x="44" y="406" width="352" height="148" rx="14" fill="#1b1c2b" stroke="#4b4c6f"/>
<text x="62" y="436" font-size="17" fill="#f4f4f5" font-weight="600">Fork / validation</text>
<text x="62" y="463" font-size="14" fill="#acafbf" font-weight="400">Auth logic</text>
<text x="62" y="491" font-size="13" fill="#b9baff" font-weight="400">Own branch and worktree</text>
<text x="62" y="527" font-size="13" fill="#e0e1ea" font-weight="400">Session · Codex + Shell</text>
<rect x="44" y="579" width="352" height="148" rx="14" fill="#1b1c2b" stroke="#4b4c6f"/>
<text x="62" y="609" font-size="17" fill="#f4f4f5" font-weight="600">Fork / api-tests</text>
<text x="62" y="636" font-size="14" fill="#acafbf" font-weight="400">API tests</text>
<text x="62" y="664" font-size="13" fill="#b9baff" font-weight="400">Own branch and worktree</text>
<text x="62" y="700" font-size="13" fill="#e0e1ea" font-weight="400">Session · Claude Code + Shell</text>
<text x="44" y="762" font-size="12" fill="#8edbb7" font-weight="400">↑ Review, then merge into the parent Workspace</text>
<text x="44" y="798" font-size="13" fill="#acafbf" font-weight="400">Sessions share a checkout within</text>
<text x="44" y="818" font-size="13" fill="#acafbf" font-weight="400">the same Workspace / Fork.</text>
<text x="44" y="857" font-size="14" fill="#e0e1ea" font-weight="400">Todo · Track tasks</text>
<text x="44" y="887" font-size="14" fill="#e0e1ea" font-weight="400">Diff / History · Review changes</text>
<text x="44" y="917" font-size="14" fill="#e0e1ea" font-weight="400">amux · Manage processes</text>
<path d="M220 956 L220 973" fill="none" stroke="#a5a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="980" width="392" height="140" rx="14" fill="#10221f" stroke="#326555"/>
<text x="44" y="1009" font-size="17" fill="#8edbb7" font-weight="600">Review and deliver</text>
<text x="44" y="1037" font-size="13" fill="#acafbf" font-weight="400">1. Sync / resolve conflicts</text>
<text x="44" y="1064" font-size="13" fill="#acafbf" font-weight="400">2. Merge locally or push branch</text>
<text x="44" y="1091" font-size="13" fill="#acafbf" font-weight="400">3. Archive when finished</text>
<text x="28" y="1154" font-size="13" fill="#e0e1ea" font-weight="400">Work persists across Session changes.</text>
<text x="28" y="1181" font-size="11" fill="#acafbf" font-weight="400">Local-first. Remote review and CI stay on your Git host.</text>
<text x="28" y="1204" font-size="11" fill="#acafbf" font-weight="400">Worktree cleanup is an explicit deletion choice.</text></g></svg>
