<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description"><title id="title">Treefold 产品架构</title><desc id="description">组织相关仓库与参考目录. 承载一项 feature. 从 Todo 展开并行子任务. 独立分支与 worktree. 同一 Workspace / Fork 内的 Session 共享 checkout. 检查后合回父 Workspace. 代码、Todo 与交付记录归属于工作；更换 Session 后仍然保留。. 本地优先 · 远端评审与 CI 在 Git 托管平台完成 · 归档保留 worktree，删除时显式清理</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a5a6ff"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0.5" y="0.5" width="1119" height="789" rx="14" fill="#0d0e12" stroke="#343747"/>
<text x="28" y="44" font-size="28" fill="#f4f4f5" font-weight="650">Treefold 产品架构</text>
<text x="28" y="74" font-size="16" fill="#acafbf" font-weight="400">并行展开，干净收敛。</text>
