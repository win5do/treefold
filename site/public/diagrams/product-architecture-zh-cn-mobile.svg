<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1230" viewBox="0 0 440 1230" role="img" aria-labelledby="title description"><title id="title">Treefold 产品架构</title><desc id="description">组织相关仓库与参考目录. 承载一项 feature. 从 Todo 展开并行子任务. 独立分支与 worktree. 同一 Workspace / Fork 内的 Session 共享 checkout. 检查后合回父 Workspace. 代码、Todo 与交付记录归属于工作；更换 Session 后仍然保留。. 本地优先 · 远端评审与 CI 在 Git 托管平台完成 · 归档保留 worktree，删除时显式清理</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a5a6ff"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0.5" y="0.5" width="439" height="1229" rx="14" fill="#0d0e12" stroke="#343747"/>
<text x="28" y="44" font-size="24" fill="#f4f4f5" font-weight="650">Treefold 产品架构</text>
<text x="28" y="74" font-size="13" fill="#acafbf" font-weight="400">并行展开，干净收敛。</text>
<rect x="24" y="98" width="392" height="112" rx="14" fill="#15171e" stroke="#343747"/>
<text x="44" y="128" font-size="19" fill="#b9baff" font-weight="650">Project</text>
<text x="44" y="158" font-size="13" fill="#f4f4f5" font-weight="400">组织相关仓库与参考目录</text>
<text x="44" y="188" font-size="12" fill="#acafbf" font-weight="400">前端仓库 · 后端仓库 · 只读 Context</text>
<path d="M220 210 L220 230" fill="none" stroke="#a5a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="236" width="392" height="720" rx="14" fill="#141420" stroke="#6263a0"/>
<text x="44" y="268" font-size="20" fill="#c0c1ff" font-weight="650">Workspace</text>
<text x="44" y="294" font-size="15" fill="#f4f4f5" font-weight="400">承载一项 feature</text>
<text x="44" y="320" font-size="13" fill="#acafbf" font-weight="400">各仓库的独立分支与 worktree</text>
<text x="44" y="349" font-size="13" fill="#acafbf" font-weight="400">Agent / Shell Session · 执行与接续</text>
<text x="44" y="387" font-size="14" fill="#c0c1ff" font-weight="400">从 Todo 展开并行子任务</text>
<rect x="44" y="406" width="352" height="148" rx="14" fill="#1b1c2b" stroke="#4b4c6f"/>
<text x="62" y="436" font-size="17" fill="#f4f4f5" font-weight="600">Fork / validation</text>
<text x="62" y="463" font-size="14" fill="#acafbf" font-weight="400">认证逻辑</text>
<text x="62" y="491" font-size="13" fill="#b9baff" font-weight="400">独立分支与 worktree</text>
<text x="62" y="527" font-size="13" fill="#e0e1ea" font-weight="400">Session · Codex + Shell</text>
<rect x="44" y="579" width="352" height="148" rx="14" fill="#1b1c2b" stroke="#4b4c6f"/>
<text x="62" y="609" font-size="17" fill="#f4f4f5" font-weight="600">Fork / api-tests</text>
<text x="62" y="636" font-size="14" fill="#acafbf" font-weight="400">API 测试</text>
<text x="62" y="664" font-size="13" fill="#b9baff" font-weight="400">独立分支与 worktree</text>
<text x="62" y="700" font-size="13" fill="#e0e1ea" font-weight="400">Session · Claude Code + Shell</text>
<text x="44" y="762" font-size="12" fill="#8edbb7" font-weight="400">↑ 检查后合回父 Workspace</text>
<text x="44" y="798" font-size="12" fill="#acafbf" font-weight="400">同一 Workspace / Fork 内的 Session 共享 checkout</text>
<text x="44" y="857" font-size="14" fill="#e0e1ea" font-weight="400">Todo · 跟进任务</text>
<text x="44" y="887" font-size="14" fill="#e0e1ea" font-weight="400">Diff / History · 检查改动</text>
<text x="44" y="917" font-size="14" fill="#e0e1ea" font-weight="400">amux · 托管进程</text>
<path d="M220 956 L220 973" fill="none" stroke="#a5a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="980" width="392" height="140" rx="14" fill="#10221f" stroke="#326555"/>
<text x="44" y="1009" font-size="17" fill="#8edbb7" font-weight="600">检查与交付</text>
<text x="44" y="1037" font-size="13" fill="#acafbf" font-weight="400">1. 同步与冲突处理</text>
<text x="44" y="1064" font-size="13" fill="#acafbf" font-weight="400">2. 本地合并或推送分支</text>
<text x="44" y="1091" font-size="13" fill="#acafbf" font-weight="400">3. 完成后归档，保留工作记录与 worktree</text>
<text x="28" y="1154" font-size="13" fill="#e0e1ea" font-weight="400">更换 Session，代码、Todo 与交付记录仍然保留。</text>
<text x="28" y="1181" font-size="11" fill="#acafbf" font-weight="400">本地优先；远端评审与 CI 在 Git 托管平台完成。</text>
<text x="28" y="1204" font-size="11" fill="#acafbf" font-weight="400">清理 worktree 与分支需在删除时显式选择。</text></g></svg>
