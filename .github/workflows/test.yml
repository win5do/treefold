name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Select pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            xtask
            src/backend
            src/cli
          cache-on-failure: true
      - name: Install dependencies
        id: dependencies
        run: |
          npm ci
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y rpm libarchive-tools libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb xdg-utils fuse3
            # Ubuntu's AppArmor restriction blocks Chromium's user-namespace sandbox.
            # Configure only this disposable CI runner; keep the application sandbox enabled.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            cargo install just --locked
          else
            brew install just
          fi
      - name: Test backend
        run: just test-backend
      - name: Test backend lifecycle and installation
        run: just test-integration
      - name: Test deterministic Electron UI
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a just test-ui; else just test-ui; fi
      - name: Build App for Electron lifecycle tests
        id: bundle
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: just build
      - name: Test packaged and development Electron lifecycles
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a just test-electron; else just test-electron; fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/treefold-playwright-results
            /tmp/treefold-*.png
