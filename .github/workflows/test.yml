name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Select pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            xtask
            src/backend
            src/cli
          cache-on-failure: true
      - name: Install dependencies
        run: |
          npm ci
          brew install just
      - name: Test backend
        run: just test-backend
      - name: Test backend lifecycle and installation
        run: just test-integration
      - name: Test deterministic Electron UI
        run: just test-ui
      - name: Build App for Electron lifecycle tests
        run: just build
      - name: Test packaged and development Electron lifecycles
        run: just test-electron
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/treefold-playwright-results
            /tmp/treefold-*.png
