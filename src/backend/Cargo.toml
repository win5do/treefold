[package]
name = "treefold-backend"
version = "0.1.0"
description = "Local-first macOS workspace for parallel coding agents"
authors = ["Treefold contributors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "treefold_lib"
crate-type = ["rlib"]

[[bin]]
name = "treefold-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
amux = { package = "amux-runtime", path = "../../../amux" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
parking_lot = "0.12"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "sqlite", "macros", "migrate", "derive", "json"
] }
moka = { version = "0.12", features = ["future"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml_edit = { version = "0.25", features = ["serde"] }
log = "0.4"
libc = "0.2"
tempfile = "3"
flexi_logger = "0.31"
fs2 = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "signal", "io-std", "io-util"] }
tokio-tungstenite = "0.27"
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
