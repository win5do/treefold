[package]
name = "treefold-cli"
version = "0.1.0-alpha.1"
description = "Command-line client for Treefold"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.97.1"

[[bin]]
name = "treefold"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
